<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستر فرايز | القائمة الفاخرة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #FF5E00;
            --primary-light: #FFF2EB;
            --dark: #0F0F0F;
            --bg: #F8F7F5;
            --card-bg: #FFFFFF;
            --text: #2D2D2D;
            --gray: #9E9E9E;
            --border: #EAEAEA;
            --shadow: 0 4px 30px rgba(0, 0, 0, 0.02);
            --sidebar-width: 380px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* -------------------------------------
           Floating Actions (Call Buttons)
           ------------------------------------- */
        .floating-actions {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 990;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .action-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 1.3rem;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .call-wrapper { position: relative; }
        .call-btn { background: #25D366; box-shadow: 0 10px 25px rgba(37, 211, 102, 0.3); }
        .call-btn:hover { transform: scale(1.1); background: #1ebd5a; }

        .call-numbers {
            position: absolute;
            bottom: 70px;
            right: 0;
            background: white;
            border-radius: 15px;
            padding: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            gap: 8px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px) scale(0.9);
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: bottom right;
            border: 1px solid var(--border);
            white-space: nowrap;
        }

        .call-numbers.show { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }

        .call-numbers a {
            text-decoration: none;
            color: var(--dark);
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 10px 15px;
            border-radius: 10px;
            background: var(--bg);
            transition: 0.2s;
            font-size: 1rem;
        }

        .call-numbers a:hover { background: var(--primary-light); color: var(--primary); }
        .call-numbers a i { color: #25D366; font-size: 1.1rem; }

        /* -------------------------------------
           Sidebar / Mobile Bottom Sheet
           ------------------------------------- */
        #invoice-sidebar {
            width: var(--sidebar-width);
            background: var(--card-bg);
            border-left: 1px solid var(--border);
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            z-index: 1000;
            padding: 30px;
            display: flex;
            flex-direction: column;
            box-shadow: 10px 0 30px rgba(0,0,0,0.02);
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .drag-handle { display: none; }
        .close-cart-btn { display: none; }

        .invoice-header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .invoice-header h2 { font-weight: 900; font-size: 1.5rem; color: var(--dark); }

        .cart-items { flex: 1; overflow-y: auto; scrollbar-width: none; }
        .cart-items::-webkit-scrollbar { display: none; }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 12px;
            background: var(--bg);
            border: 1px solid var(--border);
        }

        .cart-item-info h4 { font-size: 0.95rem; font-weight: 700; margin-bottom: 4px; }
        .cart-item-info span { font-size: 0.85rem; color: var(--primary); font-weight: 900; }

        .qty-controls { display: flex; align-items: center; gap: 10px; }
        .qty-btn { background: white; border: 1px solid var(--border); width: 25px; height: 25px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s;}
        .qty-btn:hover { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }

        .invoice-footer { border-top: 1px solid var(--border); padding-top: 20px; margin-top: auto; }
        .invoice-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: 600; font-size: 0.9rem; }
        .total-row { font-size: 1.3rem; font-weight: 900; color: var(--primary); margin-top: 10px; border-top: 2px dashed var(--primary-light); padding-top: 15px; }

        /* -------------------------------------
           Main Content
           ------------------------------------- */
        main { flex: 1; margin-left: var(--sidebar-width); padding: 40px 5%; padding-bottom: 100px; }

        .header-area { text-align: center; margin-bottom: 50px; }
        .header-area .logo { width: 150px; height: 150px; object-fit: contain; margin-bottom: 10px; }
        .header-area h1 { font-size: 2.8rem; font-weight: 900; color: var(--dark); letter-spacing: -1px; margin-bottom: 5px; }
        .header-area p { color: var(--gray); font-size: 1.1rem; }

        .social-links { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
        .social-links a {
            display: flex; align-items: center; justify-content: center; width: 45px; height: 45px;
            background-color: white; color: var(--dark); border-radius: 50%; text-decoration: none;
            font-size: 1.3rem; box-shadow: var(--shadow); transition: 0.3s; border: 1px solid var(--border);
        }
        .social-links a:hover { background-color: var(--primary); color: white; transform: translateY(-5px); border-color: var(--primary); }

        /* Tabs */
        .tabs { display: flex; justify-content: center; gap: 15px; margin-bottom: 40px; flex-wrap: wrap; }
        .tab-btn { background: white; border: 1px solid var(--border); padding: 10px 30px; border-radius: 50px; cursor: pointer; font-weight: 700; transition: 0.3s; color: var(--text); }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 10px 20px rgba(255, 94, 0, 0.2); }
        .tab-btn:hover:not(.active) { background: var(--primary-light); color: var(--primary); }

        /* Menu Grid */
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        
        .product-card {
            background: white; padding: 25px; border-radius: 20px; box-shadow: var(--shadow);
            border: 1px solid rgba(0,0,0,0.02); transition: 0.3s; display: flex; flex-direction: column; justify-content: space-between;
        }
        .product-card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 15px 35px rgba(255, 94, 0, 0.08); }
        .product-card h3 { font-size: 1.2rem; font-weight: 800; margin-bottom: 8px; }
        .product-card p { font-size: 0.85rem; color: var(--gray); line-height: 1.5; min-height: 25px; margin-bottom: 10px;}

        /* Size Selector Styling */
        .size-selector { display: flex; gap: 10px; margin-top: 5px; margin-bottom: 15px; }
        .size-option { cursor: pointer; position: relative; }
        .size-option input { display: none; }
        .size-option span {
            display: inline-block; padding: 5px 18px; border-radius: 20px; font-size: 0.85rem;
            font-weight: 700; background: var(--bg); color: var(--gray); border: 1px solid var(--border); transition: 0.3s;
        }
        .size-option input:checked + span { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }

        /* Addons Special Styling */
        .addons-card {
            background: linear-gradient(135deg, #E8F5E8, #F0F8F0) !important;
            border: 2px solid #4CAF50 !important;
            box-shadow: 0 15px 30px rgba(76, 175, 80, 0.1) !important;
        }
        .addons-badge {
            position: absolute;
            top: -10px;
            left: -10px;
            background: #4CAF50;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 900;
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
        }
        .addons-card h3 {
            color: #2E7D32 !important;
            font-size: 1.25rem !important;
        }

        /* Offer Special Styling */
        .offer-card {
            position: relative;
            background: linear-gradient(135deg, var(--primary-light), #FFE8D9) !important;
            border: 2px solid var(--primary) !important;
            box-shadow: 0 20px 40px rgba(255, 94, 0, 0.15) !important;
        }
        .offer-badge {
            position: absolute;
            top: -10px;
            right: -10px;
            background: var(--primary);
            color: white;
            padding: 8px 15px;
            border-radius: 25px;
            font-size: 0.8rem;
            font-weight: 900;
            box-shadow: 0 5px 15px rgba(255, 94, 0, 0.4);
        }
        .offer-card h3 {
            color: var(--primary) !important;
            font-size: 1.3rem !important;
        }
        .offer-card .price {
            font-size: 1.6rem !important;
            color: var(--dark) !important;
            background: var(--primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Meals Special Styling */
        .meals-card {
            position: relative;
            background: linear-gradient(135deg, #E3F2FD, #BBDEFB) !important;
            border: 2px solid #2196F3 !important;
            box-shadow: 0 15px 35px rgba(33, 150, 243, 0.15) !important;
        }
        .meals-badge {
            position: absolute;
            top: -10px;
            left: -10px;
            background: #2196F3;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 900;
            box-shadow: 0 4px 12px rgba(33, 150, 243, 0.3);
        }
        .meals-card h3 {
            color: #1976D2 !important;
            font-size: 1.25rem !important;
        }

        .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; border-top: 1px solid var(--bg); padding-top: 15px; }
        .price { font-weight: 900; font-size: 1.4rem; color: var(--primary); transition: 0.3s; }
        
        .add-btn { background: var(--dark); color: white; border: none; padding: 10px 20px; border-radius: 12px; cursor: pointer; font-size: 0.9rem; font-weight: bold; transition: 0.3s; }
        .add-btn:hover { background: var(--primary); transform: scale(1.05); }

        .form-input { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); font-size: 0.85rem; outline: none; transition: 0.3s; }
        .form-input:focus { border-color: var(--primary); background: white; }

        .btn-confirm { background: #25D366; color: white; width: 100%; padding: 15px; border: none; border-radius: 15px; font-weight: 800; font-size: 1rem; cursor: pointer; margin-top: 15px; transition: 0.3s; }
        .btn-confirm:hover { background: #1ebd5a; box-shadow: none; }

        /* -------------------------------------
           Mobile Adjustments (Responsive UI)
           ------------------------------------- */
        .mobile-cart-bar { display: none; }
        .cart-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 995; opacity: 0; transition: 0.3s; }

        @media (max-width: 992px) {
            body { flex-direction: column; }
            main { margin-left: 0; padding: 20px 5% 120px; }
            .header-area h1 { font-size: 2.2rem; }
            
            /* Floating Call Button Move Up */
            .floating-actions { bottom: 90px; right: 20px; }

            /* Mobile Sticky Cart Bar */
            .mobile-cart-bar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                position: fixed;
                bottom: 20px;
                left: 5%;
                right: 5%;
                width: 90%;
                background: var(--primary);
                color: white;
                padding: 15px 25px;
                border-radius: 20px;
                z-index: 998;
                box-shadow: 0 10px 30px rgba(255, 94, 0, 0.3);
                cursor: pointer;
            }
            .m-cart-info { font-weight: bold; font-size: 1.1rem; display: flex; align-items: center; gap: 8px;}
            .m-cart-info .badge { 
                background: white; 
                color: var(--primary); 
                padding: 2px 8px; 
                border-radius: 10px; 
                font-size: 0.9rem;
                font-weight: 900;
            }
            .m-cart-total { font-weight: 900; font-size: 1.2rem; color: white; }

            /* Sidebar to Bottom Sheet */
            #invoice-sidebar {
                width: 100%;
                height: 90vh; 
                top: auto;
                bottom: -100%;
                left: 0;
                border-left: none;
                border-radius: 30px 30px 0 0;
                padding: 20px 5% 50px; 
                overflow-y: auto; 
            }

            #invoice-sidebar.show-cart { bottom: 0; }
            .cart-overlay.show { display: block; opacity: 1; }

            .cart-items {
                flex: unset;
                overflow-y: visible;
            }

            .drag-handle {
                display: block;
                width: 50px;
                height: 5px;
                background: var(--border);
                border-radius: 10px;
                margin: 0 auto 15px;
            }

            .close-cart-btn {
                display: flex;
                justify-content: center;
                align-items: center;
                background: var(--bg);
                border: none;
                width: 35px;
                height: 35px;
                border-radius: 50%;
                font-size: 1.2rem;
                cursor: pointer;
                color: var(--text);
            }
        }

        @media (max-width: 480px) {
            .tabs { gap: 10px; }
            .tab-btn { padding: 8px 20px; font-size: 0.9rem; }
        }
    </style>
</head>

           //  { id: 'o1', category: 'offers', name: 'عرض السوري الفاخر', price: 100, desc: '(شاورما سوري + بطاطس سوري + ستربس سوري)', isOffer: true },

            { id: 'a11', category: 'addons', name: 'باكت بطاطس', price: 15, desc: '', isAddon: true }
        ];

        let cart = [];

        function renderMenu(items) {
            const container = document.getElementById('menu-container');
            
            container.innerHTML = items.map(item => {
                let priceDisplay = '';
                let sizeHtml = '';

                if (item.variants) {
                    priceDisplay = `<span class="price" id="price_${item.id}">${item.variants[0].price} ج</span>`;
                    sizeHtml = `
                        <div class="size-selector">
                            ${item.variants.map((v, index) => `
                                <label class="size-option">
                                    <input type="radio" name="size_${item.id}" value="${index}" ${index === 0 ? 'checked' : ''} onchange="updateProductPrice('${item.id}', ${v.price})">
                                    <span>${v.size}</span>
                                </label>
                            `).join('')}
                        </div>
                    `;
                } else {
                    priceDisplay = `<span class="price" id="price_${item.id}">${item.price} ج</span>`;
                }

                let cardClass = '';
                let badgeHtml = '';
                
                if (item.isOffer) {
                    cardClass = 'offer-card';
                    badgeHtml = '<div class="offer-badge">عرض خاص 🔥</div>';
                } else if (item.isAddon) {
                    cardClass = 'addons-card';
                    badgeHtml = '<div class="addons-badge">إضافة ➕</div>';
                } else if (item.category === 'meals') {
                    cardClass = 'meals-card';
                    badgeHtml = '<div class="meals-badge">وجبة كاملة 🍽️</div>';
                }

                return `
                    <div class="product-card ${cardClass}" data-product-id="${item.id}">
                        ${badgeHtml}
                        <div>
                            <h3>${item.name}</h3>
                            ${item.desc ? `<p>${item.desc}</p>` : ''}
                            ${sizeHtml}
                        </div>
                        <div class="card-footer">
                            ${priceDisplay}
                            <button class="add-btn" onclick="addToCart('${item.id}')">
                                إضافة <i class="fa-solid fa-cart-plus"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateProductPrice(productId, price) {
            document.getElementById(`price_${productId}`).innerText = price + ' ج';
        }

        function filterItems(cat, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            const filteredItems = menu.filter(i => i.category === cat);
            renderMenu(filteredItems);
        }

        function addToCart(productId) {
            const product = menu.find(i => i.id === productId);
            if (!product) return;

            let cartItemName = product.name;
            let cartItemPrice = product.price;
            let cartItemId = product.id;

            // Check size variant
            if (product.variants) {
                const radios = document.getElementsByName(`size_${productId}`);
                let selectedIndex = 0;
                for (let i = 0; i < radios.length; i++) {
                    if (radios[i].checked) { 
                        selectedIndex = i; 
                        break; 
                    }
                }
                const selectedVariant = product.variants[selectedIndex];
                cartItemName = `${product.name} (${selectedVariant.size})`;
                cartItemPrice = selectedVariant.price;
                cartItemId = `${product.id}_${selectedIndex}`;
            }

            const existingItem = cart.find(i => i.cartId === cartItemId);
            
            if (existingItem) {
                existingItem.qty += 1;
                existingItem.name = cartItemName;
            } else {
                cart.push({ 
                    cartId: cartItemId, 
                    name: cartItemName, 
                    price: cartItemPrice, 
                    qty: 1,
                    type: product.isAddon ? 'إضافة' : (product.category === 'meals' ? 'وجبة' : 'طلب')
                });
            }
            
            updateCartUI();
        }

        function changeQty(cartId, amount) {
            const item = cart.find(i => i.cartId === cartId);
            if (item) {
                item.qty += amount;
                if (item.qty <= 0) {
                    cart = cart.filter(i => i.cartId !== cartId);
                }
                updateCartUI();
            }
        }

        function updateCartUI() {
            const list = document.getElementById('cart-list');
            if(cart.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:var(--gray); margin-top:20px;">السلة فارغة، اختار اللي يعجبك</p>';
            } else {
                list.innerHTML = cart.map(item => `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <h4>${item.name} <span class="item-qty">x${item.qty}</span></h4>
                            <span>${item.price * item.qty} ج ${item.type ? `(${item.type})` : ''}</span>
                        </div>
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="changeQty('${item.cartId}', 1)">+</button>
                            <button class="qty-btn" onclick="changeQty('${item.cartId}', -1)">-</button>
                        </div>
                    </div>
                `).join('');
            }
            updateTotals();
        }

        function updateTotals() {
            const foodTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const select = document.getElementById('cust-region');
            const delivery = parseInt(select.options[select.selectedIndex]?.getAttribute('data-price')) || 0;
            const grandTotal = foodTotal + delivery;
            
            document.getElementById('food-total').innerText = foodTotal + " ج";
            document.getElementById('delivery-price').innerText = delivery + " ج";
            document.getElementById('grand-total').innerText = grandTotal + " ج";

            document.getElementById('mobile-count').innerText = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('mobile-total').innerText = grandTotal + " ج";
        }

        function sendOrder() {
            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;
            const select = document.getElementById('cust-region');
            const region = select.options[select.selectedIndex].text;
            const address = document.getElementById('cust-address').value;

            if(cart.length === 0) return alert("السلة فارغة يا فندم!");
            if(!name || !phone || select.value === "" || !address) return alert("برجاء استكمال بيانات التوصيل (الاسم، الرقم، المنطقة، العنوان) لتأكيد طلبك.");

            let msg = `طلب جديد من مستر فرايز\n\n`;
            msg += `العميل: ${name}\n`;
            msg += `التليفون: ${phone}\n`;
            msg += `المنطقة: ${region}\n`;
            msg += `العنوان: ${address}\n\n`;
            msg += `الطلبات:\n`;
            
            cart.forEach(item => {
                msg += `• ${item.name} (عدد: ${item.qty}) = ${item.price * item.qty} ج ${item.type ? `(${item.type})` : ''}\n`;
            });
            
            const foodTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const delivery = parseInt(select.options[select.selectedIndex].getAttribute('data-price')) || 0;
            const grandTotal = foodTotal + delivery;

            msg += `\nحساب الأكل: ${foodTotal} ج\n`;
            msg += `حساب التوصيل: ${delivery} ج\n`;
            msg += `الإجمالي النهائي المطلوب: ${grandTotal} ج\n\n`;

            // واتساب مباشرة على الرقم 01035827265
            const whatsappNumber = "01035827265";
            const whatsappUrl = `https://wa.me/201035827265?text=${encodeURIComponent(msg)}`;
            
            // افتح واتساب مباشرة
            window.open(whatsappUrl, '_blank');
        }

        // Initial render
        renderMenu(menu.filter(i => i.category === 'crepe'));
        updateCartUI();
    </script>
