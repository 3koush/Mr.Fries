<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FF5E00">
    <title>مستر فرايز | المنيو</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Lalezar&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #FF5E00;
            --primary-dark: #E04F00;
            --primary-light: #FFF2EB;
            --dark: #0F0F0F;
            --bg: #F8F7F5;
            --card-bg: #FFFFFF;
            --text: #2D2D2D;
            --gray: #8A8A8A;
            --border: #EAEAEA;
            --whatsapp: #25D366;
            --sidebar-width: 380px;
            --display: 'Lalezar', 'Cairo', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        button, input, select { font-family: inherit; }
        :focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }

        /* -------------------------------------
           Hero
           ------------------------------------- */
        main { margin-left: var(--sidebar-width); }

        .hero {
            position: relative;
            isolation: isolate;
            background: var(--primary);
            color: #fff;
            text-align: center;
            padding: 48px 6% 40px;
        }

        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            background-image: radial-gradient(rgba(255,255,255,0.14) 1.5px, transparent 1.7px);
            background-size: 18px 18px;
        }

        .hero-spikes {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            height: 46px;
            display: block;
            fill: var(--primary);
            z-index: 2;
        }

        .hero-logo {
            width: 132px;
            height: 132px;
            border-radius: 50%;
            background: #fff;
            padding: 8px;
            object-fit: contain;
            box-shadow: 0 0 0 6px rgba(255,255,255,0.25);
        }

        .hero h1 {
            font-family: var(--display);
            font-weight: 400;
            font-size: clamp(3.2rem, 9vw, 5.6rem);
            line-height: 1.05;
            margin-top: 14px;
            text-shadow: 0.06em 0.06em 0 var(--dark);
        }

        .hero .tagline {
            font-family: var(--display);
            font-size: clamp(1.35rem, 3.2vw, 1.9rem);
            color: var(--dark);
            margin-top: 4px;
        }

        .hero-meta {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px 22px;
            margin-top: 18px;
            font-weight: 700;
            font-size: 0.95rem;
        }

        .hero-meta a, .hero-meta span {
            color: #fff;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .hero-meta a:hover { text-decoration: underline; text-underline-offset: 4px; }

        .social-links { display: flex; justify-content: center; gap: 10px; margin-top: 20px; }
        .social-links a {
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            border: 1.5px solid rgba(255,255,255,0.5);
            color: #fff;
            font-size: 1.15rem;
            text-decoration: none;
            transition: background 0.2s, color 0.2s;
        }
        .social-links a:hover { background: #fff; color: var(--primary); }

        /* -------------------------------------
           Menu content
           ------------------------------------- */
        .content {
            max-width: 1120px;
            margin: 0 auto;
            padding: 70px 5% 140px;
        }

        .tabs-wrap {
            position: sticky;
            top: 0;
            z-index: 40;
            margin: 0 -5% 26px;
            padding: 12px 5%;
            background: rgba(248, 247, 245, 0.92);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
        }

        .tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            padding: 3px;
        }
        .tabs::-webkit-scrollbar { display: none; }

        .tab-btn {
            flex: 0 0 auto;
            background: #fff;
            border: 1.5px solid var(--border);
            padding: 9px 22px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text);
            cursor: pointer;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }
        .tab-btn:hover:not(.active) { border-color: var(--primary); color: var(--primary); }
        .tab-btn.active { background: var(--dark); border-color: var(--dark); color: #fff; }

        .section-head {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px 16px;
            margin-bottom: 18px;
        }

        .section-tag {
            --tooth: 9px;
            display: inline-block;
            background: var(--primary);
            color: #fff;
            font-family: var(--display);
            font-weight: 400;
            font-size: clamp(1.7rem, 4vw, 2.3rem);
            line-height: 1.25;
            padding: 8px 30px calc(var(--tooth) + 10px);
            -webkit-mask:
                linear-gradient(#000 0 0) top / 100% calc(100% - var(--tooth)) no-repeat,
                conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / calc(var(--tooth) * 2) var(--tooth) repeat-x;
            mask:
                linear-gradient(#000 0 0) top / 100% calc(100% - var(--tooth)) no-repeat,
                conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / calc(var(--tooth) * 2) var(--tooth) repeat-x;
        }

        .section-note { color: var(--gray); font-weight: 700; font-size: 0.9rem; padding-bottom: 12px; }

        .menu-panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 6px 28px;
            overflow: hidden;
        }

        .menu-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr));
            column-gap: 48px;
            margin-top: -1.5px;
        }

        .item {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 18px 0;
            border-top: 1.5px dashed var(--border);
        }

        .item-top { display: flex; align-items: baseline; gap: 10px; }

        .item-name {
            font-size: 1.08rem;
            font-weight: 800;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .leader {
            flex: 1;
            min-width: 20px;
            border-bottom: 2px dotted #D4D4D4;
            transform: translateY(-5px);
        }

        .price {
            font-weight: 900;
            font-size: 1.3rem;
            color: var(--primary);
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }
        .price small { font-size: 0.75rem; font-weight: 800; margin-inline-start: 3px; }

        .item-desc { font-size: 0.85rem; color: var(--gray); line-height: 1.6; }

        .new-tag {
            background: var(--primary);
            color: #fff;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 1px 8px;
            border-radius: 6px;
            transform: rotate(-4deg);
        }

        .item-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-height: 40px;
        }

        .size-selector { display: flex; flex-wrap: wrap; gap: 6px; }
        .size-option { cursor: pointer; }
        .size-option input { position: absolute; opacity: 0; pointer-events: none; }
        .size-option span {
            display: inline-block;
            padding: 4px 15px;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 700;
            background: var(--bg);
            color: var(--gray);
            border: 1.5px solid transparent;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }
        .size-option input:checked + span { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
        .size-option input:focus-visible + span { outline: 3px solid var(--primary); outline-offset: 2px; }

        .add-btn {
            margin-inline-start: auto;
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            border-radius: 12px;
            background: var(--dark);
            color: #fff;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
        }
        .add-btn:hover { background: var(--primary); }
        .add-btn:active { transform: scale(0.92); }
        .add-btn.added { background: var(--primary); }

        /* Featured rows (meals / special) */
        .item.featured {
            grid-column: 1 / -1;
            background: var(--dark);
            color: #fff;
            border: none;
            border-radius: 20px;
            padding: 28px;
            margin: 20px 0;
            position: relative;
            overflow: hidden;
            isolation: isolate;
        }
        .item.featured::after {
            content: "";
            position: absolute;
            inset: 0 auto 0 0;
            width: 45%;
            z-index: -1;
            background-image: radial-gradient(rgba(255, 94, 0, 0.35) 1.5px, transparent 1.7px);
            background-size: 16px 16px;
            -webkit-mask-image: linear-gradient(to right, #000, transparent);
            mask-image: linear-gradient(to right, #000, transparent);
        }
        .item.featured .item-name { color: #fff; font-family: var(--display); font-weight: 400; font-size: clamp(1.7rem, 4vw, 2.3rem); }
        .item.featured .leader { border-color: rgba(255,255,255,0.22); }
        .item.featured .price { font-size: 2rem; }
        .item.featured .item-desc { color: rgba(255,255,255,0.6); }
        .item.featured .size-option span { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.75); }
        .item.featured .size-option input:checked + span { background: var(--primary); color: #fff; border-color: var(--primary); }
        .item.featured .add-btn { width: auto; padding: 0 20px; height: 44px; background: var(--primary); font-size: 0.95rem; }
        .item.featured .add-btn:hover { background: var(--primary-dark); }

        .empty {
            text-align: center;
            padding: 56px 20px;
        }
        .empty i { font-size: 2.6rem; color: var(--primary); margin-bottom: 14px; }
        .empty h3 { font-size: 1.2rem; font-weight: 800; color: var(--dark); margin-bottom: 6px; }
        .empty p { color: var(--gray); font-size: 0.95rem; max-width: 40ch; margin: 0 auto; line-height: 1.7; }

        /* -------------------------------------
           Floating call button
           ------------------------------------- */
        .floating-actions { position: fixed; bottom: 28px; right: 28px; z-index: 990; }
        .call-wrapper { position: relative; }

        .call-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            background: var(--primary);
            color: #fff;
            font-size: 1.3rem;
            cursor: pointer;
            display: grid;
            place-items: center;
            box-shadow: 0 10px 25px rgba(255, 94, 0, 0.35);
            transition: transform 0.2s, background 0.2s;
        }
        .call-btn:hover { background: var(--primary-dark); transform: scale(1.06); }

        .call-numbers {
            position: absolute;
            bottom: 70px;
            right: 0;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 8px;
            box-shadow: 0 14px 30px rgba(0,0,0,0.14);
            display: flex;
            flex-direction: column;
            gap: 6px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transform: translateY(12px) scale(0.95);
            transform-origin: bottom right;
            transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .call-numbers.show { opacity: 1; visibility: visible; transform: none; }

        .call-numbers a {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 10px 14px;
            border-radius: 10px;
            background: var(--bg);
            color: var(--dark);
            font-weight: 800;
            text-decoration: none;
            transition: background 0.2s, color 0.2s;
        }
        .call-numbers a:hover { background: var(--primary-light); color: var(--primary); }
        .call-numbers a i { color: var(--primary); }

        /* -------------------------------------
           Cart sidebar / bottom sheet
           ------------------------------------- */
        #invoice-sidebar {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            width: var(--sidebar-width);
            z-index: 1000;
            background: var(--card-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .drag-handle { display: none; }

        .invoice-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 28px 16px;
            border-bottom: 1px solid var(--border);
        }
        .invoice-header h2 {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--display);
            font-weight: 400;
            font-size: 1.9rem;
            color: var(--dark);
        }

        .count-pill {
            min-width: 28px;
            height: 28px;
            padding: 0 8px;
            border-radius: 999px;
            background: var(--primary);
            color: #fff;
            font-family: 'Cairo', sans-serif;
            font-size: 0.85rem;
            font-weight: 800;
            display: grid;
            place-items: center;
        }

        .close-cart-btn {
            display: none;
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            background: var(--bg);
            color: var(--text);
            font-size: 1.1rem;
            cursor: pointer;
        }

        .cart-items { flex: 1; min-height: 140px; overflow-y: auto; padding: 6px 28px; scrollbar-width: thin; }

        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 0;
            border-bottom: 1.5px dashed var(--border);
        }
        .cart-item-info h4 { font-size: 0.95rem; font-weight: 700; color: var(--dark); line-height: 1.5; }
        .cart-item-info span { font-size: 0.9rem; font-weight: 800; color: var(--primary); }

        .qty-controls {
            display: flex;
            align-items: center;
            flex-shrink: 0;
            background: var(--bg);
            border-radius: 999px;
            padding: 3px;
        }
        .qty-btn {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 50%;
            background: #fff;
            color: var(--dark);
            font-size: 0.75rem;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.08);
            transition: background 0.2s, color 0.2s;
        }
        .qty-btn:hover { background: var(--primary); color: #fff; }
        .qty-num { min-width: 30px; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; }

        .cart-empty { text-align: center; color: var(--gray); padding: 40px 10px; }
        .cart-empty i { font-size: 2.2rem; color: #D9D9D9; margin-bottom: 12px; }
        .cart-empty strong { display: block; color: var(--dark); font-size: 1rem; margin-bottom: 4px; }
        .cart-empty p { font-size: 0.88rem; }

        .invoice-footer {
            padding: 18px 28px 24px;
            border-top: 1px solid var(--border);
            background: var(--bg);
        }
        .footer-title { font-weight: 800; font-size: 0.95rem; color: var(--dark); margin-bottom: 10px; }

        .form-input {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 10px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            background: #fff;
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-input:focus { border-color: var(--primary); }

        .totals { margin-top: 8px; }
        .invoice-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: 600; font-size: 0.92rem; }
        .total-row {
            font-size: 1.25rem;
            font-weight: 900;
            color: var(--dark);
            border-top: 2px dashed #DCDCDC;
            padding-top: 12px;
            margin-top: 6px;
        }
        .total-row span:last-child { color: var(--primary); }

        .btn-confirm {
            width: 100%;
            margin-top: 14px;
            padding: 15px;
            border: none;
            border-radius: 14px;
            background: var(--whatsapp);
            color: #fff;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.2s;
        }
        .btn-confirm i { font-size: 1.25rem; }
        .btn-confirm:hover { background: #1ebd5a; }

        /* -------------------------------------
           Mobile
           ------------------------------------- */
        .mobile-cart-bar { display: none; }
        .cart-overlay {
            position: fixed;
            inset: 0;
            z-index: 995;
            background: rgba(0,0,0,0.55);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }

        @keyframes bump {
            0% { transform: scale(1); }
            40% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        .bump { animation: bump 0.4s ease; }

        @media (max-width: 992px) {
            main { margin-left: 0; }
            .hero { padding: 36px 6% 30px; }
            .hero-logo { width: 110px; height: 110px; }
            .content { padding: 58px 5% 130px; }
            .menu-panel { padding: 4px 18px; border-radius: 20px; }
            .item.featured { padding: 22px; margin: 16px 0; }

            .floating-actions { bottom: 96px; right: 16px; }

            .mobile-cart-bar {
                position: fixed;
                left: 16px;
                right: 16px;
                bottom: 16px;
                z-index: 998;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 14px 20px;
                border: none;
                border-radius: 18px;
                background: var(--dark);
                color: #fff;
                font-size: 1rem;
                cursor: pointer;
                box-shadow: 0 12px 30px rgba(0,0,0,0.25);
            }
            .m-cart-info { display: flex; align-items: center; gap: 10px; font-weight: 800; }
            .m-cart-info .badge {
                min-width: 26px;
                height: 26px;
                padding: 0 7px;
                border-radius: 999px;
                background: var(--primary);
                color: #fff;
                font-size: 0.85rem;
                font-weight: 900;
                display: grid;
                place-items: center;
            }
            .m-cart-total { font-weight: 900; font-size: 1.1rem; }

            #invoice-sidebar {
                top: auto;
                width: 100%;
                height: 88vh;
                border-right: none;
                border-radius: 28px 28px 0 0;
                transform: translateY(105%);
            }
            #invoice-sidebar.show-cart { transform: none; }
            .cart-overlay.show { opacity: 1; visibility: visible; }

            .drag-handle { display: block; width: 48px; height: 5px; margin: 12px auto 0; border-radius: 10px; background: var(--border); }
            .invoice-header { padding: 12px 5% 14px; }
            .close-cart-btn { display: grid; place-items: center; }
            .cart-items { flex: none; overflow: visible; padding: 6px 5%; }
            .invoice-footer { padding: 18px 5% 40px; }
        }

        @media (max-width: 480px) {
            .tab-btn { padding: 8px 18px; font-size: 0.9rem; }
            .hero-meta { font-size: 0.88rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition: none !important; animation: none !important; }
            html { scroll-behavior: auto; }
        }
    </style>
</head>

<body>

    <div class="cart-overlay" onclick="toggleMobileCart()"></div>

    <div class="floating-actions">
        <div class="call-wrapper">
            <div class="call-numbers" id="call-numbers">
                <a href="tel:01109593136">01109593136 <i class="fa-solid fa-phone-volume"></i></a>
                <a href="tel:01035827265">01035827265 <i class="fa-solid fa-phone-volume"></i></a>
            </div>
            <button class="call-btn" onclick="toggleCallMenu()" aria-label="اتصل بينا"><i class="fa-solid fa-phone"></i></button>
        </div>
    </div>

    <button class="mobile-cart-bar" onclick="toggleMobileCart()">
        <span class="m-cart-info">
            <i class="fa-solid fa-basket-shopping"></i>
            طلبك
            <span class="badge" id="mobile-count">0</span>
        </span>
        <span class="m-cart-total" id="mobile-total">0 ج</span>
    </button>

    <aside id="invoice-sidebar" aria-label="طلبك">
        <div class="drag-handle"></div>
        <div class="invoice-header">
            <h2>طلبك <span class="count-pill" id="cart-count">0</span></h2>
            <button class="close-cart-btn" onclick="toggleMobileCart()" aria-label="إغلاق"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="cart-items" id="cart-list"></div>

        <div class="invoice-footer">
            <div class="footer-title">بيانات التوصيل</div>
            <input type="text" id="cust-name" class="form-input" placeholder="اسمك الكريم">
            <input type="tel" id="cust-phone" class="form-input" placeholder="رقم التليفون">
            
            <select id="cust-region" class="form-input" onchange="updateTotals()">
                <option value="" data-price="0">اختر المنطقة...</option>
                <option value="الشؤون" data-price="15">الشؤون</option>
                <option value="دردشة" data-price="15">دردشة</option>
                <option value="التجنيد" data-price="20">التجنيد</option>
                <option value="مساكن" data-price="20">مساكن</option>

        const featuredCategories = ['meals', 'special'];

        function priceHtml(price) {
            return `${price}<small>ج</small>`;
        }

        function renderMenu(cat) {
            const container = document.getElementById('menu-container');
            const items = menu.filter(i => i.category === cat);
            const info = categories[cat] || { title: '' };

            const head = `
                <div class="section-head">
                    <h2 class="section-tag">${info.title}</h2>
                    ${info.note ? `<span class="section-note">${info.note}</span>` : ''}
                </div>
            `;

            if (items.length === 0) {
                container.innerHTML = head + `
                    <div class="menu-panel">
                        <div class="empty">
                            <i class="fa-solid fa-fire"></i>
                            <h3>مفيش عروض دلوقتي</h3>
                            <p>تابع صفحتنا على فيسبوك وانستجرام عشان تلحق العروض أول ما تنزل.</p>
                        </div>
                    </div>
                `;
                return;
            }

            const rows = items.map(item => {
                const featured = featuredCategories.includes(item.category);
                const startPrice = item.variants ? item.variants[0].price : item.price;
                const desc = item.desc ? item.desc.replace(/[()]/g, '').trim() : '';

                let sizeHtml = '<span></span>';
                if (item.variants) {
                    sizeHtml = `
                        <div class="size-selector" role="radiogroup" aria-label="الحجم">
                            ${item.variants.map((v, index) => `
                                <label class="size-option">
                                    <input type="radio" name="size_${item.id}" value="${index}" ${index === 0 ? 'checked' : ''} onchange="updateProductPrice('${item.id}', ${v.price})">
                                    <span>${v.size}</span>
                                </label>
                            `).join('')}
                        </div>
                    `;
                }

                const btnContent = featured
                    ? 'أضف للطلب <i class="fa-solid fa-plus"></i>'
                    : '<i class="fa-solid fa-plus"></i>';

                return `
                    <article class="item ${featured ? 'featured' : ''}" data-product-id="${item.id}">
                        <div class="item-top">
                            <h3 class="item-name">${item.name.trim()}${item.isNew ? '<span class="new-tag">جديد</span>' : ''}</h3>
                            <span class="leader"></span>
                            <span class="price" id="price_${item.id}">${priceHtml(startPrice)}</span>
                        </div>
                        ${desc ? `<p class="item-desc">${desc}</p>` : ''}
                        <div class="item-bottom">
                            ${sizeHtml}
                            <button class="add-btn" onclick="addToCart('${item.id}', this)" aria-label="أضف ${item.name.trim()} للطلب">${btnContent}</button>
                        </div>
                    </article>
                `;
            }).join('');

            container.innerHTML = head + `<div class="menu-panel"><div class="menu-list">${rows}</div></div>`;
        }

        function updateProductPrice(productId, price) {
            document.getElementById(`price_${productId}`).innerHTML = priceHtml(price);
        }

        function filterItems(cat, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });

            renderMenu(cat);

            const anchor = document.getElementById('menu-anchor');
            const anchorTop = anchor.parentElement.getBoundingClientRect().top + window.scrollY + 40;
            if (window.scrollY > anchorTop) {
                window.scrollTo({ top: anchorTop, behavior: 'smooth' });
            }
        }

        function flashAdded(btn) {
            if (!btn) return;
            const original = btn.innerHTML;
            const featured = btn.closest('.featured');
            btn.classList.add('added');
            btn.innerHTML = featured ? 'اتضاف <i class="fa-solid fa-check"></i>' : '<i class="fa-solid fa-check"></i>';
            clearTimeout(btn._t);
            btn._t = setTimeout(() => {
                btn.classList.remove('added');
                btn.innerHTML = original;
            }, 900);
        }

        function bump(el) {
            if (!el) return;
            el.classList.remove('bump');
            void el.offsetWidth;
            el.classList.add('bump');
        }

        function addToCart(productId, btn) {
            const product = menu.find(i => i.id === productId);
            if (!product) return;

            let cartItemName = product.name.trim();
            let cartItemPrice = product.price;
            let cartItemId = product.id;

            // Check size variant
            if (product.variants) {
                const radios = document.getElementsByName(`size_${productId}`);
                let selectedIndex = 0;
                for (let i = 0; i < radios.length; i++) {
                    if (radios[i].checked) { 
                        selectedIndex = i; 
                        break; 
                    }
                }
                const selectedVariant = product.variants[selectedIndex];
                cartItemName = `${product.name.trim()} (${selectedVariant.size})`;
                cartItemPrice = selectedVariant.price;
                cartItemId = `${product.id}_${selectedIndex}`;
            }

            const existingItem = cart.find(i => i.cartId === cartItemId);
            
            if (existingItem) {
                existingItem.qty += 1;
                existingItem.name = cartItemName;
            } else {
                cart.push({ 
                    cartId: cartItemId, 
                    name: cartItemName, 
                    price: cartItemPrice, 
                    qty: 1,
                    type: product.isAddon ? 'إضافة' : (product.category === 'meals' ? 'وجبة' : 'طلب')
                });
            }
            
            if (btn && btn.innerHTML.indexOf('fa-check') === -1) flashAdded(btn);
            updateCartUI();
            bump(document.getElementById('mobile-count'));
            bump(document.getElementById('cart-count'));
        }

        function changeQty(cartId, amount) {
            const item = cart.find(i => i.cartId === cartId);
            if (item) {
                item.qty += amount;
                if (item.qty <= 0) {
                    cart = cart.filter(i => i.cartId !== cartId);
                }
                updateCartUI();
            }
        }

        function updateCartUI() {
            const list = document.getElementById('cart-list');
            if (cart.length === 0) {
                list.innerHTML = `
                    <div class="cart-empty">
                        <i class="fa-solid fa-basket-shopping"></i>
                        <strong>لسه ما اخترتش حاجة</strong>
                        <p>اختار من المنيو وطلبك هيظهر هنا.</p>
                    </div>
                `;
            } else {
                list.innerHTML = cart.map(item => `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <h4>${item.name}</h4>
                            <span>${item.price * item.qty} ج</span>
                        </div>
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="changeQty('${item.cartId}', 1)" aria-label="زوّد واحد"><i class="fa-solid fa-plus"></i></button>
                            <span class="qty-num">${item.qty}</span>
                            <button class="qty-btn" onclick="changeQty('${item.cartId}', -1)" aria-label="قلّل واحد"><i class="fa-solid ${item.qty === 1 ? 'fa-trash-can' : 'fa-minus'}"></i></button>
                        </div>
                    </div>
                `).join('');
            }
            updateTotals();
        }

        function updateTotals() {
            const foodTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const select = document.getElementById('cust-region');
            const delivery = parseInt(select.options[select.selectedIndex]?.getAttribute('data-price')) || 0;
            const grandTotal = foodTotal + delivery;
            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            
            document.getElementById('food-total').innerText = foodTotal + " ج";
            document.getElementById('delivery-price').innerText = delivery + " ج";
            document.getElementById('grand-total').innerText = grandTotal + " ج";

            document.getElementById('mobile-count').innerText = count;
            document.getElementById('cart-count').innerText = count;
            document.getElementById('mobile-total').innerText = grandTotal + " ج";
        }

        function sendOrder() {
            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;
            const select = document.getElementById('cust-region');
            const region = select.options[select.selectedIndex].text;
            const address = document.getElementById('cust-address').value;

            if(cart.length === 0) return alert("السلة فارغة يا فندم!");
            if(!name || !phone || select.value === "" || !address) return alert("برجاء استكمال بيانات التوصيل (الاسم، الرقم، المنطقة، العنوان) لتأكيد طلبك.");

            let msg = `طلب جديد من مستر فرايز\n\n`;
            msg += `العميل: ${name}\n`;
            msg += `التليفون: ${phone}\n`;
            msg += `المنطقة: ${region}\n`;
            msg += `العنوان: ${address}\n\n`;
            msg += `الطلبات:\n`;
            
            cart.forEach(item => {
                msg += `• ${item.name} (عدد: ${item.qty}) = ${item.price * item.qty} ج ${item.type ? `(${item.type})` : ''}\n`;
            });
            
            const foodTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const delivery = parseInt(select.options[select.selectedIndex].getAttribute('data-price')) || 0;
            const grandTotal = foodTotal + delivery;

            msg += `\nحساب الأكل: ${foodTotal} ج\n`;
            msg += `حساب التوصيل: ${delivery} ج\n`;
            msg += `الإجمالي النهائي المطلوب: ${grandTotal} ج\n\n`;

            // واتساب مباشرة على الرقم 01035827265
            const whatsappUrl = `https://wa.me/201035827265?text=${encodeURIComponent(msg)}`;
            window.open(whatsappUrl, '_blank');
        }

        // Initial render
        renderMenu('crepe');
        updateCartUI();
    </script>
</body>
</html>
